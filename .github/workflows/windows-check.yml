name: windows-check

# Windows is not in the regular CI any more (too slow, 2026-11-24). Run this by hand when a release
# should be checked on Windows: gh workflow run windows-check --ref main -f ref=v1.8.3
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tag, branch or commit to test"
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows:
    name: windows-latest / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest flask flask-cors pyyaml
      - name: pytest
        run: python -m pytest tests/ -q
