<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Settings · DnE</title>
<link rel="icon" href="icons/favicon.ico">
<style>
  :root {
    --canvas:#F4F5F6; --ink:#1D1F22; --mut:#5A6069; --line:rgba(29,31,34,.14);
    --field:#FFFFFF; --accent:#4F6B88; --accent-ink:#FFFFFF; --sel:rgba(79,107,136,.12); --warn:#8A5A1C;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas:#17181A; --ink:#DADBDD; --mut:rgba(218,219,221,.66); --line:rgba(218,219,221,.16);
      --field:#1F2124; --accent:#8FA3B8; --accent-ink:#17181A; --sel:rgba(143,163,184,.16); --warn:#D9A866; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink);
    font:16px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sukhumvit Set", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 140px; }
  h1 { font-size:1.6rem; margin:0 0 4px; text-wrap:balance; }
  .lede { color:var(--mut); margin:0 0 24px; }
  section { border-top:1px solid var(--line); padding:18px 0; }
  h2 { font-size:1.05rem; margin:0 0 2px; }
  h2 code { font-size:.8em; color:var(--mut); font-weight:400; margin-left:6px; }
  .hint { color:var(--mut); font-size:.9rem; margin:0 0 10px; }
  .opts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
  label.opt { display:block; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    background:var(--field); cursor:pointer; min-height:44px; }
  label.opt input { position:absolute; opacity:0; pointer-events:none; }
  label.opt b { display:block; font-weight:600; }
  label.opt span { display:block; color:var(--mut); font-size:.85rem; line-height:1.4; }
  label.opt:has(input:checked) { border-color:var(--accent); background:var(--sel); box-shadow:inset 0 0 0 1px var(--accent); }
  label.opt:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:2px; }
  label.opt:has(input:disabled) { opacity:.45; cursor:not-allowed; }
  .ex { font-size:.9rem; margin:10px 0 0; padding:10px 12px; border-radius:10px; background:var(--sel); }
  .ex span { display:block; margin-top:2px; }
  .warn { color:var(--warn); font-size:.88rem; margin:10px 0 0; }
  textarea { width:100%; min-height:64px; border:1px solid var(--line); border-radius:10px; background:var(--field);
    color:var(--ink); font:inherit; padding:10px 12px; resize:vertical; }
  .two { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  .two label { font-weight:600; display:block; margin-bottom:4px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--canvas); border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar-in { max-width:720px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:12px 22px; min-height:44px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  #status { color:var(--mut); font-size:.9rem; flex:1; }
  pre { white-space:pre-wrap; background:var(--field); border:1px solid var(--line); border-radius:10px;
    padding:12px; font-size:.85rem; margin:8px 0 0; }
  details summary { cursor:pointer; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Table settings</h1>
  <p class="lede">Pick your settings, press Copy, then paste the text to the GM (in chat or the display's message box). The GM saves them to Session Flags.</p>
  <form id="f"></form>
  <details><summary>Preview the text</summary><pre id="out"></pre></details>
</main>
<div class="bar"><div class="bar-in">
  <span id="status" aria-live="polite"></span>
  <button type="button" id="copy">Copy settings</button>
</div></div>

<script>
// key, title, hint, default, example scene, [value, label, description, what the GM does]
const DIALS = [
  ["pacing", "Pacing", "How often trouble arrives that the players didn't go looking for", "mixed",
   "You walk back to the inn after the job.", [
    ["adventure", "Adventure", "Trouble any scene, hard cuts",
     "Halfway there, a hooded figure falls into step beside you: \"You took something that isn't yours.\""],
    ["mixed", "Mixed", "At most once a scene, quiet turns between",
     "The walk is quiet. At the inn the barkeep mentions someone was asking about you, then you're free to rest."],
    ["slow", "Slow burn", "Rarely unasked; the players drive the story",
     "The walk is quiet. You eat, chat with the barkeep about the harvest and sleep. Nothing finds you unless you go looking."]]],
  ["difficulty", "Difficulty", "How hard failure bites", "standard",
   "You fail a climb up a wet wall.", [
    ["easy", "Easy", "Danger is telegraphed early", "You slip and land hard, but you're fine and nobody heard."],
    ["standard", "Standard", "", "You fall and take a little damage; a dog starts barking."],
    ["hard", "Hard", "Mistakes hurt", "You fall, take real damage and twist an ankle; guards are coming."],
    ["deadly", "Deadly", "Characters can die", "You fall into the yard, badly hurt, and the guards are already drawing swords."]]],
  ["spotlight", "Spotlight", "Who steers the story", "balanced",
   "You arrive in a new town with no plan.", [
    ["dm_led", "GM leads", "Strong, frequent hooks", "A messenger finds you at once with a job offer and a deadline."],
    ["balanced", "Balanced", "", "The GM shows a few things going on (a notice board, a brawl, a stranger watching you) and asks what you do."],
    ["player_led", "Players lead", "The GM waits for you to pick a direction", "The GM describes the town and waits; the story starts wherever you go."]]],
  ["companions", "Companions", "How often NPCs travelling with you speak up unasked", "normal",
   "You pick a lock while your companion keeps watch.", [
    ["quiet", "Quiet", "Speak when asked or when it matters", "She watches the corridor in silence and speaks only when a guard appears."],
    ["normal", "Normal", "", "She mutters \"faster\" once and keeps watch."],
    ["chatty", "Chatty", "Banter, opinions, asides", "She teases your technique, guesses what's inside and wonders aloud about dinner."]]],
  ["rolls", "Rolls", "How often the GM asks for a roll", "normal",
   "You climb a rope ladder on a calm day.", [
    ["few", "Few", "Only when failure really matters", "It just works. Rolls are kept for moments when falling would matter."],
    ["normal", "Normal", "", "On a calm day it just works; in a storm, you'd roll."],
    ["many", "Many", "Most risky actions", "Roll Athletics. Even routine risks get a roll."]]],
  ["show_dc", "Show the DC", "Tell you the difficulty before you roll", "on",
   "You try to talk a guard into letting you pass.", [
    ["on", "Show", "e.g. DC 13", "\"Roll Persuasion, DC 15.\""],
    ["off", "Hide", "Roll without knowing the number", "\"Roll Persuasion.\" You learn how hard it was from what the guard does."]]],
  ["turn_end", "End of turn", "", "open",
   "A guarded bridge blocks the road.", [
    ["open", "Open", "You decide what to do", "Two guards, one torch, the river below. What do you do?"],
    ["options", "Options", "2–3 numbered choices, or anything else", "1) Swim under the bridge  2) Bribe the guards  3) Wait for the shift change, or something else."]]],
  ["engine", "Rules engine", "How much of the game runs on the rules scripts", "full",
   "You pick a fight with a veteran guard captain.", [
    ["full", "Full", "Fights tracked blow by blow, XP from the tables",
     "The captain gets HP and AC, initiative is rolled, each attack is resolved and XP comes from his challenge rating."],
    ["light", "Light", "The GM judges fights and XP; rolls still matter",
     "The GM calls for a roll or two and narrates how the fight goes, then awards XP by feel."]]],
  ["survival", "Supplies & weather", "Track what the party uses up (needs the world engine)", "off",
   "Three days into the wasteland the water is getting low.", [
    ["off", "Off", "The table handles supplies as before", "The GM mentions thirst when it suits the scene."],
    ["on", "On", "Stores fall as time passes; you are warned in time", "The journey stops: water for two more days. Press on, turn back, or look for a well?"]]],
  ["beat_policy", "Planned story beats", "When you stop something the story had planned", "auto",
   "The GM planned a betrayal at the gate. You catch the traitor two days early.", [
    ["auto", "By campaign type", "Sandbox and dynamic: you can prevent it. Written adventures: it is reshaped", "The table's campaign type decides."],
    ["players_can_prevent", "You can prevent it", "", "The betrayal never happens. The story goes on from your success."],
    ["must_land", "It lands another way", "", "The gate holds, but what the betrayal was for still happens, in a new shape that fits what you did."]]],
  ["world_engine", "World engine (experimental)", "Turns that survive a crash, rolls that happen once, a world that moves on its own", "off",
   "The game stops mid-turn: a crash, or the chat is compacted.", [
    ["off", "Off", "Play as before", "The GM picks up from its notes and what is saved."],
    ["on", "On", "Opt in for this campaign", "The turn resumes where it stopped: the roll already made is kept and nothing is shown twice."]]],
  ["npc_growth", "NPC growth", "How fast people you know grow while you're away", "normal",
   "You meet a rival again after four months on the road.", [
    ["off", "Off", "They stay as you left them", "She is as strong as the day you parted."],
    ["slow", "Slow", "A step every 120 in-world days", "She has gained a level and a new scar, and tells you how."],
    ["normal", "Normal", "A step every 60 in-world days", "She is two levels up, leads her own crew now, and has a history you missed."],
    ["fast", "Fast", "A step every 30 in-world days", "She is four levels up and barely the person you knew."]]],
  ["roll_mode", "Who rolls", "", "players",
   "The GM calls for a Stealth check.", [
    ["players", "Players roll", "", "You roll your own dice (or the display's) and send the result."],
    ["auto", "GM rolls", "", "The GM rolls for you and shows the result."]]],
  ["content", "Content level", "Picking 18 or 20 confirms everyone at the table is that age or older", "standard",
   "A fight ends with an enemy badly wounded.", [
    ["standard", "Standard", "Real danger, told briefly", "He goes down and doesn't get up. The scene moves on."],
    ["18", "18+", "Blood, injury and horror on screen", "The wound is described plainly, he's gasping, and the others see what you did."],
    ["20", "20+", "The hardest level", "The wound and his pain are shown in full, and the scene stays on them before moving on."]]],
  ["romance", "Romance", "Adult characters only", "fade",
   "Two adult characters share a quiet moment after a long night.", [
    ["off", "Off", "No romance plots", "They say goodnight. Any attraction stays in the background."],
    ["fade", "Fade", "Romance happens; intimate scenes cut away", "A kiss, then the scene cuts to the next morning, and things between them have changed."],
    ["open", "Open", "Intimate scenes on screen, non-explicit (needs 18/20)", "The scene stays with them, told through feeling and atmosphere rather than explicit detail, then carries into the story."]]],
  ["success_at_cost", "Success at a cost", "A near miss can succeed for a price", "on",
   "You miss the DC by 1 picking a lock.", [
    ["on", "On", "", "The lock opens, but your pick snaps and someone heard the click."],
    ["off", "Off", "", "The lock holds."]]],
  ["degrees", "Degrees of success", "Critical successes and failures on checks", "on",
   "You beat the DC by 10 searching a room.", [
    ["on", "On", "", "Critical success: you find what you came for and a hidden compartment too."],
    ["off", "Off", "", "Success: you find what you came for."]]],
  ["hero_points", "Hero Points", "Points to turn a bad moment around", "off",
   "Your character fails a save that would knock them out.", [
    ["on", "On", "", "You spend a Hero Point to reroll and stay on your feet."],
    ["off", "Off", "", "The roll stands."]]],
];
const LISTS = [["lines", "Lines: never in the story"], ["veils", "Veils: may happen, off screen"]];

const q = new URLSearchParams(location.search);   // prefill: setup.html?pacing=slow&content=18
const f = document.getElementById("f");
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
for (const [key, title, hint, def, scene, opts] of DIALS) {
  const cur = opts.some(o => o[0] === q.get(key)) ? q.get(key) : def;
  f.insertAdjacentHTML("beforeend", `<section><h2>${title}<code>${key}</code></h2>` +
    (hint ? `<p class="hint">${hint}</p>` : "") + `<div class="opts" role="radiogroup" aria-label="${title}">` +
    opts.map(([v, l, d]) => `<label class="opt"><input type="radio" name="${key}" value="${v}"${v === cur ? " checked" : ""}>` +
      `<b>${l}</b>${d ? `<span>${d}</span>` : ""}</label>`).join("") + `</div>` +
    `<p class="ex"><b>Example:</b> ${esc(scene)} <span id="ex-${key}"></span></p>` +
    (key === "romance" ? `<p class="warn" id="romance-note" hidden>“Open” needs content level 18 or 20</p>` : "") + `</section>`);
}
f.insertAdjacentHTML("beforeend", `<section><h2>Lines &amp; Veils</h2><p class="hint">Separate with commas, e.g. spiders, animal cruelty</p><div class="two">` +
  LISTS.map(([k, l]) => `<div><label for="${k}">${l}</label><textarea id="${k}" name="${k}">${esc(q.get(k) || "")}</textarea></div>`).join("") +
  `</div></section>`);

function text() {
  const d = new FormData(f), lines = ["[DnE table settings]",
    "Write each line to state.md → ## Session Flags (replace the old value), confirm in one line, then keep playing:"];
  for (const [key] of DIALS) lines.push(`- ${key}: ${d.get(key)}`);
  for (const [k] of LISTS) {
    const v = String(d.get(k) || "").split(/[,\n]/).map(s => s.trim()).filter(Boolean).join("; ");
    lines.push(`- ${k}: ${v || "(none)"}`);
  }
  return lines.join("\n");
}
function sync() {
  const adult = ["18", "20"].includes(new FormData(f).get("content"));
  const open = f.querySelector('input[name=romance][value=open]');
  open.disabled = !adult;
  if (!adult && open.checked) f.querySelector('input[name=romance][value=fade]').checked = true;
  document.getElementById("romance-note").hidden = adult;
  const d = new FormData(f);
  for (const [key, , , , , opts] of DIALS)
    document.getElementById("ex-" + key).textContent = "→ " + opts.find(o => o[0] === d.get(key))[3];
  document.getElementById("out").textContent = text();
}
f.addEventListener("change", sync); f.addEventListener("input", sync); sync();

const status = document.getElementById("status");
document.getElementById("copy").addEventListener("click", async () => {
  const t = text();
  try { await navigator.clipboard.writeText(t); }
  catch {   // http over LAN or file:// without clipboard permission
    const ta = Object.assign(document.createElement("textarea"), {value: t});
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  status.textContent = "Copied. Paste it to the GM.";
});
</script>
</body>
</html>
